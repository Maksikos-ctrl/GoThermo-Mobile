name: gothermo_mobile
description: GoThermo team chat for iOS and Android.
publish_to: none
version: 0.3.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  flutter_webrtc: ^1.2.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sounds/
